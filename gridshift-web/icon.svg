<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tileDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Tiles grid 3x3 representation -->
  <rect x="76" y="76" width="105" height="105" rx="20" fill="url(#tileDark)"/>
  <rect x="203" y="76" width="105" height="105" rx="20" fill="url(#tileDark)"/>
  <rect x="331" y="76" width="105" height="105" rx="20" fill="url(#tileGrad)"/>

  <rect x="76" y="203" width="105" height="105" rx="20" fill="url(#tileDark)"/>
  <rect x="203" y="203" width="105" height="105" rx="20" fill="url(#tileGrad)"/>
  <rect x="331" y="203" width="105" height="105" rx="20" fill="url(#tileDark)"/>

  <rect x="76" y="331" width="105" height="105" rx="20" fill="url(#tileGrad)"/>
  <rect x="203" y="331" width="105" height="105" rx="20" fill="url(#tileDark)"/>
  <!-- Empty slot at bottom-right (331, 331) -->
  <rect x="331" y="331" width="105" height="105" rx="20" fill="#0f172a" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
</svg>
