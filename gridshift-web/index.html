<!DOCTYPE html>
<html lang="pt-BR" data-theme="tactile-ivory">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>GridShift — Tactile Number Puzzle</title>
  
  <meta name="description" content="Sliding Tile Puzzle tátil com arrasto multicasas e suporte a temas.">
  <meta name="theme-color" content="#182029">

  <!-- PWA & iOS Safari meta tags -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GridShift">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Barra Superior de Navegação -->
    <header class="top-nav">
      <button type="button" id="themeBtn" class="circle-btn" title="Alternar Tema Visual" aria-label="Tema">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
        </svg>
      </button>

      <!-- Badge Seletora de Dificuldade -->
      <div class="difficulty-picker" id="difficultyPicker">
        <button type="button" class="diff-btn" data-size="3">3X3</button>
        <button type="button" class="diff-btn" data-size="4">4X4</button>
        <button type="button" class="diff-btn active" data-size="5">5X5</button>
      </div>

      <button type="button" id="audioToggleBtn" class="circle-btn" title="Alternar Som" aria-label="Som">
        <svg id="soundIconOn" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
        <svg id="soundIconOff" class="hidden" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
    </header>

    <!-- Subcabeçalho: Título e HUD -->
    <div class="header-status">
      <h1 class="main-title" id="statusTitle">GridShift</h1>
      <div class="status-indicators">
        <div class="indicator-item" title="Tempo Decorrido">
          <span class="icon" aria-hidden="true">⏱</span>
          <span id="timerText" class="val">00:00</span>
        </div>
        <div class="indicator-item" title="Contador de Movimentos">
          <span class="icon" aria-hidden="true">👣</span>
          <span id="movesText" class="val">0</span>
        </div>
      </div>
    </div>

    <!-- Tabuleiro Central 1:1 -->
    <main class="board-area">
      <div id="boardContainer" class="board-container" role="grid" aria-label="Tabuleiro de Blocos">
        <!-- Injetado dinamicamente via app.js -->
      </div>
    </main>

    <!-- Botão de Ação Inferior estilo Print -->
    <footer class="bottom-action">
      <button type="button" id="restartBtn" class="pill-action-btn">
        Reiniciar
      </button>
    </footer>
  </div>

  <!-- Menu / Modal Seletor de Temas -->
  <div id="themeModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="themeModalTitle">
    <div class="modal-card theme-picker-card">
      <h2 id="themeModalTitle" class="modal-title">Escolher Tema</h2>
      <p class="modal-subtitle">Alterne a estética do tabuleiro e das peças</p>

      <div class="theme-options-grid">
        <button type="button" class="theme-opt-btn active" data-set-theme="tactile-ivory">
          <span class="theme-swatch ivory"></span>
          <span class="theme-name">Marfim Tátil (Padrão)</span>
        </button>
        <button type="button" class="theme-opt-btn" data-set-theme="slate-dark">
          <span class="theme-swatch slate"></span>
          <span class="theme-name">Slate Dark</span>
        </button>
        <button type="button" class="theme-opt-btn" data-set-theme="classic-wood">
          <span class="theme-swatch wood"></span>
          <span class="theme-name">Madeira Nobre</span>
        </button>
        <button type="button" class="theme-opt-btn" data-set-theme="neon-night">
          <span class="theme-swatch neon"></span>
          <span class="theme-name">Neon Cyber</span>
        </button>
      </div>

      <button type="button" id="closeThemeModalBtn" class="pill-action-btn close-btn">
        Fechar
      </button>
    </div>
  </div>

  <!-- Modal de Vitória -->
  <div id="victoryModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="victoryTitle">
    <div class="modal-card">
      <div class="trophy-icon" aria-hidden="true">🏆</div>
      <h2 id="victoryTitle" class="modal-title">VITÓRIA!</h2>
      <p class="modal-subtitle">Quebra-cabeça resolvido com sucesso.</p>

      <div class="modal-stats">
        <div class="modal-stat-box">
          <span class="m-label">TEMPO</span>
          <span id="finalTimeText" class="m-value">00:00</span>
        </div>
        <div class="modal-stat-box">
          <span class="m-label">MOVIMENTOS</span>
          <span id="finalMovesText" class="m-value">0</span>
        </div>
      </div>

      <div id="bestRecordBadge" class="record-badge">
        Recorde: 00:00 / 0 mov.
      </div>

      <button type="button" id="playAgainBtn" class="pill-action-btn">
        JOGAR NOVAMENTE
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
