name: Build Mobile (Android & iOS)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plataforma alvo (android, ios ou all)'
        required: true
        default: 'all'

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  # Ajuste para a versao exata do Unity usada no projeto (ex: 2022.3.48f1 ou 6000.0.23f1)
  UNITY_VERSION: "6000.0.23f1"

jobs:
  build-android:
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'all' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android (.aab)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          customParameters: "-buildAppBundle"
          androidKeystoreName: user.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload Android Artifact (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: gridshift-android-aab
          path: build/Android/

  build-ios:
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'all' || github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**') }}
          restore-keys: |
            Library-iOS-${{ env.UNITY_VERSION }}-

      - name: Build iOS (Xcode Project / IPA)
        uses: game-ci/unity-builder@v4
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildMethod: BuildScript.PerformBuild

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gridshift-ios-build
          path: build/iOS/
